name: Scrape course catalog

# Once a day: fetch the newest published semesters from Ritaj's public Course Browser through
# FlareSolverr (same container as course-schedule, no login) and commit data/ when it changed.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC, early morning in Palestine
  workflow_dispatch:
    inputs:
      terms:
        description: "Semester codes to scrape instead of the newest 3 (space-separated, e.g. 1252 1251)"
        required: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      flaresolverr:
        image: flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
    env:
      FLARESOLVERR_URL: http://localhost:8191/v1
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Test the parser
        run: uv run --group dev pytest -q

      - name: Scrape
        run: |
          if [ -n "${{ inputs.terms }}" ]; then
            uv run python -m bzu_catalog scrape --terms ${{ inputs.terms }} --out data
          else
            uv run python -m bzu_catalog scrape --newest 3 --out data
          fi

      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only index.json changed means a plain daily check; anything else is new schedule data
          if [ -n "$(git diff --cached --name-only -- . ':(exclude)data/index.json')" ]; then msg="Update catalog"; else msg="Daily check"; fi
          git commit -m "$msg: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
