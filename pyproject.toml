[project]
name = "bzu-course-catalog"
version = "0.1.0"
description = "Birzeit University course schedules as JSON, scraped hourly from Ritaj's public Course Browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "lxml>=5.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
